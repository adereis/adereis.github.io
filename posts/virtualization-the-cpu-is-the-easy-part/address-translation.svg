<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 482" width="720" height="482" role="img" aria-labelledby="t d">
  <title id="t">A VM adds a second translation</title>
  <desc id="d">Two chains. In a process, a virtual address goes through the page tables the OS keeps to physical memory. In a VM, a virtual address goes through the guest's page tables to guest physical memory, which is not real, and then through the host's page tables to physical memory. In both, the TLB remembers recent answers so most accesses skip the whole chain.</desc>

  <style>
    .plate { fill: #eef2f3; stroke: #d1d9dc; stroke-width: 1; }
    text   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; fill: #1d2a2f; }
    .mono  { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .h     { font-size: 24px; font-weight: 600; }
    .b     { font-size: 22px; font-weight: 600; }
    .l     { font-size: 22px; }
    .s     { font-size: 22px; fill: #5c6b71; }
    .mid   { text-anchor: middle; }
    .end   { text-anchor: end; }
  </style>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 8" refX="4" refY="4" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" orient="auto"><path d="M0 0L10 4L0 8z" fill="#1d2a2f"/></marker>
    <marker id="a-ink-l" viewBox="0 0 10 8" refX="4" refY="4" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" orient="auto"><path d="M0 0L10 4L0 8z" fill="#1d2a2f"/></marker>
    <marker id="a-sub" viewBox="0 0 10 8" refX="4" refY="4" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" orient="auto"><path d="M0 0L10 4L0 8z" fill="#59a1af"/></marker>
    <marker id="a-sub-l" viewBox="0 0 10 8" refX="4" refY="4" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" orient="auto"><path d="M0 0L10 4L0 8z" fill="#59a1af"/></marker>
    <marker id="a-cost" viewBox="0 0 10 8" refX="4" refY="4" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" orient="auto"><path d="M0 0L10 4L0 8z" fill="#834d78"/></marker>
    <marker id="a-cost-l" viewBox="0 0 10 8" refX="4" refY="4" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" orient="auto"><path d="M0 0L10 4L0 8z" fill="#834d78"/></marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#eef2f3"/><line x1="4" y1="0" x2="4" y2="8" stroke="#834d78" stroke-width="2"/></pattern>
  </defs>

  <rect class="plate" x="0.5" y="0.5" width="719" height="481" rx="14"/>

  <text class="h" x="40" y="56">a process</text>
  <text class="h" x="380" y="56">a VM</text>
  <!-- a process: one map, kept by the OS -->
  <rect x="40" y="80" width="230" height="50" rx="10" fill="none" stroke="#1d2a2f" stroke-width="1.5"/>
  <text class="l mid" x="155" y="112.92">virtual address</text>
  <rect x="40" y="156" width="230" height="50" rx="10" fill="#bdcbcf"/>
  <text class="l mid" x="155" y="188.92">page tables</text>
  <path d="M 155 132 L 155 148" fill="none" stroke="#1d2a2f" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <rect x="40" y="232" width="230" height="50" rx="10" fill="none" stroke="#1d2a2f" stroke-width="1.5"/>
  <text class="b mid" x="155" y="264.92">physical memory</text>
  <path d="M 155 208 L 155 224" fill="none" stroke="#1d2a2f" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <path d="M 270 105.0 L 296 105.0 L 296 257.0 L 281 257.0" fill="none" stroke="#59a1af" stroke-width="2.5" marker-end="url(#a-sub-l)"/>
  <text class="b" x="308" y="189">TLB</text>
  <!-- a VM: the guest's map lands in memory that is itself virtual, so the host maps it again -->
  <rect x="380" y="80" width="230" height="50" rx="10" fill="none" stroke="#1d2a2f" stroke-width="1.5"/>
  <text class="l mid" x="495" y="112.92">virtual address</text>
  <rect x="380" y="156" width="230" height="50" rx="10" fill="#bdcbcf"/>
  <text class="l mid" x="495" y="188.92">guest page tables</text>
  <path d="M 495 132 L 495 148" fill="none" stroke="#1d2a2f" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <rect x="380" y="232" width="230" height="50" rx="10" fill="none" stroke="#5c6b71" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="l mid" x="495" y="264.92">guest "physical"</text>
  <path d="M 495 208 L 495 224" fill="none" stroke="#1d2a2f" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <rect x="380" y="308" width="230" height="50" rx="10" fill="#bdcbcf" stroke="#834d78" stroke-width="2.5"/>
  <text class="l mid" x="495" y="340.92">host page tables</text>
  <path d="M 495 284 L 495 300" fill="none" stroke="#1d2a2f" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <rect x="380" y="384" width="230" height="50" rx="10" fill="none" stroke="#1d2a2f" stroke-width="1.5"/>
  <text class="b mid" x="495" y="416.92">physical memory</text>
  <path d="M 495 360 L 495 376" fill="none" stroke="#1d2a2f" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <path d="M 610 105.0 L 636 105.0 L 636 409.0 L 621 409.0" fill="none" stroke="#59a1af" stroke-width="2.5" marker-end="url(#a-sub-l)"/>
  <text class="b" x="648" y="265">TLB</text>
</svg>
