<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 364" width="720" height="364" role="img" aria-labelledby="t d">
  <title id="t">A program is instructions in memory</title>
  <desc id="d">On the left, memory holds a list of instructions, MOV EAX, EDX, then MOV [EBX], EDX, then ADD EAX, 1, and further down some data. On the right, the CPU's registers: the instruction pointer points at MOV EAX, EDX, the next instruction to run, which copies the value in EDX into EAX. EBX holds an address, pointing at the data in memory.</desc>

  <style>
    .plate { fill: #eef2f3; stroke: #d1d9dc; stroke-width: 1; }
    text   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; fill: #1d2a2f; }
    .mono  { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .h     { font-size: 24px; font-weight: 600; }
    .b     { font-size: 22px; font-weight: 600; }
    .l     { font-size: 22px; }
    .s     { font-size: 22px; fill: #5c6b71; }
    .mid   { text-anchor: middle; }
    .end   { text-anchor: end; }
  </style>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 8" refX="4" refY="4" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" orient="auto"><path d="M0 0L10 4L0 8z" fill="#1d2a2f"/></marker>
    <marker id="a-ink-l" viewBox="0 0 10 8" refX="4" refY="4" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" orient="auto"><path d="M0 0L10 4L0 8z" fill="#1d2a2f"/></marker>
    <marker id="a-sub" viewBox="0 0 10 8" refX="4" refY="4" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" orient="auto"><path d="M0 0L10 4L0 8z" fill="#59a1af"/></marker>
    <marker id="a-sub-l" viewBox="0 0 10 8" refX="4" refY="4" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" orient="auto"><path d="M0 0L10 4L0 8z" fill="#59a1af"/></marker>
    <marker id="a-cost" viewBox="0 0 10 8" refX="4" refY="4" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" orient="auto"><path d="M0 0L10 4L0 8z" fill="#834d78"/></marker>
    <marker id="a-cost-l" viewBox="0 0 10 8" refX="4" refY="4" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" orient="auto"><path d="M0 0L10 4L0 8z" fill="#834d78"/></marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#eef2f3"/><line x1="4" y1="0" x2="4" y2="8" stroke="#834d78" stroke-width="2"/></pattern>
  </defs>

  <rect class="plate" x="0.5" y="0.5" width="719" height="363" rx="14"/>

  <text class="s" x="40" y="52">memory</text>
  <text class="s" x="420" y="52">the CPU's registers</text>
  <!-- memory: a few instructions, then some data -->
  <rect x="40" y="76" width="280" height="46" rx="6" fill="#59a1af" stroke="#1d2a2f" stroke-width="1.5"/>
  <text class="l mono" x="56" y="106.92">MOV EAX, EDX</text>
  <rect x="40" y="128" width="280" height="46" rx="6" fill="none" stroke="#1d2a2f" stroke-width="1.5"/>
  <text class="l mono" x="56" y="158.92">MOV [EBX], EDX</text>
  <rect x="40" y="180" width="280" height="46" rx="6" fill="none" stroke="#1d2a2f" stroke-width="1.5"/>
  <text class="l mono" x="56" y="210.92">ADD EAX, 1</text>
  <text class="s" x="56" y="262">…</text>
  <rect x="40" y="284" width="280" height="46" rx="6" fill="none" stroke="#1d2a2f" stroke-width="1.5"/>
  <text class="s" x="56" y="314.92">data</text>
  <!-- the CPU -->
  <rect x="420" y="64" width="260" height="278" rx="10" fill="none" stroke="#1d2a2f" stroke-width="1.5"/>
  <rect x="436" y="76" width="228" height="46" rx="6" fill="none" stroke="#1d2a2f" stroke-width="1.5"/>
  <text class="l mid" x="550" y="106.92">instruction pointer</text>
  <rect x="436" y="180" width="90" height="46" rx="6" fill="none" stroke="#1d2a2f" stroke-width="1.5"/>
  <text class="l mono mid" x="481" y="210.92">EAX</text>
  <rect x="574" y="180" width="90" height="46" rx="6" fill="none" stroke="#1d2a2f" stroke-width="1.5"/>
  <text class="l mono mid" x="619" y="210.92">EDX</text>
  <rect x="436" y="284" width="90" height="46" rx="6" fill="none" stroke="#1d2a2f" stroke-width="1.5"/>
  <text class="l mono mid" x="481" y="314.92">EBX</text>
  <text class="s" x="540" y="315">an address</text>
  <!-- the instruction pointer names the next instruction to run; EDX is copied into EAX; EBX points into memory -->
  <path d="M 436 99 L 328 99" fill="none" stroke="#1d2a2f" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <path d="M 574 203 L 537 203" fill="none" stroke="#59a1af" stroke-width="3.5" marker-end="url(#a-sub-l)"/>
  <path d="M 436 307 L 328 307" fill="none" stroke="#1d2a2f" stroke-width="1.5" marker-end="url(#a-ink)"/>
</svg>
