<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 324" width="720" height="324" role="img" aria-labelledby="t d">
  <title id="t">Steal time is not idle time</title>
  <desc id="d">One physical CPU over time. vCPU 0 runs, then waits while another VM holds the CPU, then runs again, then halts because it has nothing to do. Only the waiting slice counts as steal time: the vCPU was ready to run and was not running. The halted slice is idle, which is the guest's own business.</desc>

  <style>
    .plate { fill: #f4f1ea; stroke: #ddd7cb; stroke-width: 1; }
    text   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; fill: #2a2732; }
    .mono  { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .h     { font-size: 24px; font-weight: 600; }
    .b     { font-size: 22px; font-weight: 600; }
    .l     { font-size: 22px; }
    .s     { font-size: 22px; fill: #6c6676; }
    .mid   { text-anchor: middle; }
    .end   { text-anchor: end; }
  </style>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 8" refX="4" refY="4" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" orient="auto"><path d="M0 0L10 4L0 8z" fill="#2a2732"/></marker>
    <marker id="a-ink-l" viewBox="0 0 10 8" refX="4" refY="4" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" orient="auto"><path d="M0 0L10 4L0 8z" fill="#2a2732"/></marker>
    <marker id="a-sub" viewBox="0 0 10 8" refX="4" refY="4" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" orient="auto"><path d="M0 0L10 4L0 8z" fill="#d68228"/></marker>
    <marker id="a-sub-l" viewBox="0 0 10 8" refX="4" refY="4" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" orient="auto"><path d="M0 0L10 4L0 8z" fill="#d68228"/></marker>
    <marker id="a-cost" viewBox="0 0 10 8" refX="4" refY="4" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" orient="auto"><path d="M0 0L10 4L0 8z" fill="#994637"/></marker>
    <marker id="a-cost-l" viewBox="0 0 10 8" refX="4" refY="4" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" orient="auto"><path d="M0 0L10 4L0 8z" fill="#994637"/></marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f4f1ea"/><line x1="4" y1="0" x2="4" y2="8" stroke="#994637" stroke-width="2"/></pattern>
  </defs>

  <rect class="plate" x="0.5" y="0.5" width="719" height="323" rx="14"/>

  <text class="s" x="200" y="58">one physical CPU, over time</text>
  <text class="b" x="40" y="117.92">vCPU 0</text>
  <text class="b" x="40" y="195.92">another VM</text>
  <path d="M 200 148 L 680 148" fill="none" stroke="#ddd7cb" stroke-width="1"/>
  <path d="M 200 226 L 680 226" fill="none" stroke="#ddd7cb" stroke-width="1"/>
  <!-- vCPU 0: runs, waits while another VM runs, runs, halts -->
  <rect x="200" y="86" width="114" height="48" rx="4" fill="#d68228" stroke="#2a2732" stroke-width="1.5"/>
  <rect x="320" y="86" width="114" height="48" rx="4" fill="url(#hatch)" stroke="#994637" stroke-width="2.5"/>
  <rect x="440" y="86" width="114" height="48" rx="4" fill="#d68228" stroke="#2a2732" stroke-width="1.5"/>
  <rect x="560" y="86" width="114" height="48" rx="4" fill="none" stroke="#6c6676" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- the other VM holds the CPU only during the stolen slice -->
  <rect x="320" y="164" width="114" height="48" rx="4" fill="#c3c9cf" stroke="#2a2732" stroke-width="1.5"/>
  <text class="b mid" x="377" y="268">steal time</text>
  <text class="s mid" x="377" y="298">ready, not running</text>
  <text class="b mid" x="609" y="268">idle</text>
  <text class="s mid" x="609" y="298">nothing to run</text>
</svg>
